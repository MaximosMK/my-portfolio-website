<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f121d" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle gradient border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#mkGrad)" stroke-width="14" />

  <!-- Code bracket < -->
  <path d="M 170 180 L 105 256 L 170 332" fill="none" stroke="url(#mkGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Monogram MK -->
  <text x="256" y="295" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="140" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="-2">MK</text>

  <!-- Slash and bracket /> -->
  <path d="M 330 332 L 355 180" fill="none" stroke="#06b6d4" stroke-width="26" stroke-linecap="round" />
  <path d="M 365 180 L 415 256 L 365 332" fill="none" stroke="url(#mkGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <style>
    @media (prefers-color-scheme: light) {
      rect { fill: #ffffff; stroke: #6366f1; }
      text { fill: #0f172a; }
    }
  </style>
</svg>